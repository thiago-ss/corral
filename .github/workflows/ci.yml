name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: deterministic tests (no model needed)
        run: make test
      - name: race detector
        run: CORRAL_LIVE=0 go test ./... -count=1 -p 1 -race
      - name: vet + gofmt
        run: make vet
      - name: build with version
        run: |
          go build -ldflags "-X main.version=$(git describe --tags --always 2>/dev/null || echo dev)" -o corral ./cmd/corral
          ./corral version
