<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 246" width="900" height="246" role="img" aria-label="Three measured benchmark results. Left: wall time for 8 tasks falls from 81 ticks at 1 worker to 11 ticks at 8 workers. Middle: after a crash at 50 percent, a naive re-run costs 81 ticks against 11 to resume. Right: all 10 agents reported success and the evidence gates rejected 3 of them."><rect width="900" height="246" fill="#141612"/><text x="22.0" y="30.0" fill="#ECE8DC" font-size="15" font-weight="700" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">Parallelism</text><text x="22.0" y="50.0" fill="#A3A096" font-size="11.5" font-weight="400" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">8 tasks — wall time in ticks</text><line x1="22" y1="210.5" x2="290" y2="210.5" stroke="#2B2D27" stroke-width="1"/><rect x="38.5" y="78.0" width="34.0" height="132.0" rx="3" fill="#78A4FF"/><text x="55.5" y="70.0" fill="#ECE8DC" font-size="12.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">81</text><text x="55.5" y="227.0" fill="#A3A096" font-size="11.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">1w</text><rect x="105.5" y="143.2" width="34.0" height="66.8" rx="3" fill="#78A4FF"/><text x="122.5" y="135.2" fill="#ECE8DC" font-size="12.5" font-weight="700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">41</text><text x="122.5" y="227.0" fill="#A3A096" font-size="11.5" font-weight="400" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">2w</text><rect x="172.5" y="175.8" width="34.0" height="34.2" rx="3" fill="#78A4FF"/><text x="189.5" y="167.8" fill="#ECE8DC" font-size="12.5" font-weight="700" text-anchor