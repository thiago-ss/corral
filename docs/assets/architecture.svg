<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="corral architecture">
  <rect width="960" height="430" rx="24" fill="#FAFAF9"/>
  <text x="32" y="44" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1C1917">how corral is put together</text>

  <!-- left column: humans -->
  <g>
    <rect x="32" y="80" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="127" y="108" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">OpenCode plugin</text>
    <text x="127" y="128" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">corral_plan · start · approve…</text>
    <rect x="32" y="160" width="190" height="64" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="127" y="188" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">companion TUI</text>
    <text x="127" y="208" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">corral tui</text>
  </g>

  <!-- arrows into daemon -->
  <path d="M 222 112 H 320" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 222 192 H 320" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- daemon -->
  <rect x="320" y="76" width="230" height="152" rx="14" fill="#1C1917"/>
  <text x="435" y="104" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#F59E0B">corral daemon</text>
  <text x="435" y="128" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#E7E5E4">task graph · leases · priority+aging</text>
  <text x="435" y="148" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#E7E5E4">retries · budgets · circuit breaker</text>
  <text x="435" y="168" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#E7E5E4">evidence gates · merge</text>
  <rect x="352" y="184" width="166" height="28" rx="14" fill="#F59E0B"/>
  <text x="435" y="203" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1C1917">control API :4519</text>

  <!-- SQLite below daemon -->
  <path d="M 435 228 V 282" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="330" y="282" width="210" height="88" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
  <text x="435" y="310" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">SQLite event log</text>
  <text x="435" y="330" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">every transition, attempt, verdict</text>
  <text x="435" y="348" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">replays after crashes · audit export</text>

  <!-- daemon -> opencode sessions -->
  <path d="M 550 120 H 640" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <rect x="640" y="76" width="288" height="64" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="784" y="104" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">OpenCode sessions (workers)</text>
  <text x="784" y="124" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">each in its own git worktree</text>

  <!-- worktrees -->
  <rect x="640" y="156" width="88" height="52" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
  <text x="684" y="178" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1C1917">w1</text>
  <text x="684" y="196" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#78716C">worktree</text>
  <rect x="740" y="156" width="88" height="52" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
  <text x="784" y="178" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1C1917">w2</text>
  <text x="784" y="196" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#78716C">worktree</text>
  <rect x="840" y="156" width="88" height="52" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
  <text x="884" y="178" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1C1917">…</text>
  <text x="884" y="196" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#78716C">worktree</text>

  <!-- verified work -> main -->
  <path d="M 784 208 V 300" stroke="#A8A29E" stroke-width="3" fill="none"/>
  <rect x="640" y="300" width="288" height="70" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="784" y="328" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1C1917">main checkout</text>
  <text x="784" y="348" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">untouched until gates pass + you approve</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A29E"/>
    </marker>
  </defs>
</svg>
