<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="corral logo">
  <!-- the corral: three work pens herded into one holding pen, gate open -->
  <rect x="18" y="18" width="204" height="204" rx="34" fill="#1C1917"/>
  <!-- fence posts -->
  <rect x="52" y="52" width="10" height="136" rx="5" fill="#F59E0B" opacity="0.9"/>
  <rect x="86" y="52" width="10" height="136" rx="5" fill="#F59E0B" opacity="0.55"/>
  <rect x="120" y="52" width="10" height="136" rx="5" fill="#F59E0B" opacity="0.9"/>
  <!-- the agent herd -->
  <circle cx="66" cy="96" r="10" fill="#FAFAF9"/>
  <circle cx="66" cy="136" r="10" fill="#FAFAF9" opacity="0.75"/>
  <circle cx="100" cy="116" r="10" fill="#FAFAF9" opacity="0.55"/>
  <!-- open gate gap on the right edge -->
  <path d="M 160 52 h 26 a 8 8 0 0 1 8 8 v 112 a 8 8 0 0 1 -8 8 h -26" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <!-- released worker passing through the gate -->
  <circle cx="186" cy="116" r="9" fill="#2563EB"/>
  <path d="M 206 116 h 14" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <path d="M 208 108 l 14 8 l -14 8" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
