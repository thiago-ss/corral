<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Deterministic scheduler simulation results</title>
  <desc id="desc">Four workers complete eight independent tasks in 21 ticks instead of 81. After a crash halfway through, Corral redoes 11 ticks instead of 81. In a scripted gate demo, seven outputs pass and three are rejected before merge.</desc>
  <style>
    .paper{fill:#F3F0E8}.ink{fill:#191A16}.muted{fill:#66665E}.rail-fill{fill:#B6AFA1}.rail{stroke:#B6AFA1}.blue{fill:#2B63D9}.green{fill:#1F7A50}.red{fill:#B8453F}
    @media (prefers-color-scheme:dark){.paper{fill:#141612}.ink{fill:#ECE8DC}.muted{fill:#A3A096}.rail-fill{fill:#4B5048}.rail{stroke:#4B5048}.blue{fill:#78A4FF}.green{fill:#57C78B}.red{fill:#FF8178}}
  </style>
  <rect width="1080" height="440" rx="20" class="paper"/>
  <text x="48" y="55" class="muted" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="23">deterministic simulation · synthetic agents</text>
  <path d="M48 80H1032M360 112V392M720 112V392" class="rail" fill="none" stroke-width="2"/>

  <g font-family="'Avenir Next', Avenir, system-ui, sans-serif">
    <text x="48" y="146" class="ink" font-size="26" font-weight="700">parallel wall time</text>
    <text x="48" y="224" class="ink" font-size="72" font-weight="800" letter-spacing="-2">3.9×</text>
    <text x="48" y="258" class="muted" font-size="22">faster · 8 independent tasks</text>
    <rect x="48" y="298" width="252" height="18" rx="4" class="rail-fill"/>
    <rect x="48" y="336" width="65" height="18" rx="4" class="blue"/>
    <text x="314" y="315" class="muted" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="20" text-anchor="end">81</text>
    <text x="127" y="353" class="ink" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="20">21</text>
    <text x="48" y="388" class="muted" font-size="19">1 worker → 4 workers</text>

    <text x="408" y="146" class="ink" font-size="26" font-weight="700">crash recovery</text>
    <text x="408" y="224" class="ink" font-size="72" font-weight="800" letter-spacing="-2">7.4×</text>
    <text x="408" y="258" class="muted" font-size="22">less work repeated</text>
    <rect x="408" y="298" width="252" height="18" rx="4" class="rail-fill"/>
    <rect x="408" y="336" width="34" height="18" rx="4" class="green"/>
    <text x="674" y="315" class="muted" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="20" text-anchor="end">81</text>
    <text x="456" y="353" class="ink" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="20">11</text>
    <text x="408" y="388" class="muted" font-size="19">restart all → resume unfinished</text>

    <text x="768" y="146" class="ink" font-size="26" font-weight="700">evidence gates</text>
    <text x="768" y="224" class="ink" font-size="72" font-weight="800" letter-spacing="-2">7 / 10</text>
    <text x="768" y="258" class="muted" font-size="22">outputs passed</text>
    <g transform="translate(768 296)">
      <rect x="0" y="0" width="25" height="25" rx="4" class="green"/><rect x="31" y="0" width="25" height="25" rx="4" class="green"/><rect x="62" y="0" width="25" height="25" rx="4" class="green"/><rect x="93" y="0" width="25" height="25" rx="4" class="green"/><rect x="124" y="0" width="25" height="25" rx="4" class="green"/>
      <rect x="0" y="31" width="25" height="25" rx="4" class="green"/><rect x="31" y="31" width="25" height="25" rx="4" class="green"/><rect x="62" y="31" width="25" height="25" rx="4" class="red"/><rect x="93" y="31" width="25" height="25" rx="4" class="red"/><rect x="124" y="31" width="25" height="25" rx="4" class="red"/>
    </g>
    <text x="768" y="388" class="muted" font-size="19">3 rejected before merge</text>
  </g>
</svg>
