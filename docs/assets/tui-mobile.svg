<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Corral TUI attempt inspection</title>
  <desc id="desc">The terminal interface shows worker w1 done, its objective, role, write scope, command verification, session, worktree, and exit evidence.</desc>
  <rect width="720" height="620" rx="20" fill="#141612"/>
  <rect x="24" y="20" width="8" height="580" fill="#F2AA2A"/>
  <g font-family="'SFMono-Regular', 'Cascadia Code', 'Liberation Mono', monospace">
    <text x="64" y="52" fill="#A3A096" font-size="26">corral tui / inspect</text>
    <path d="M64 72H680" stroke="#4B5048" stroke-width="2"/>

    <text x="64" y="114" fill="#78A4FF" font-size="34" font-weight="700">node w1</text>
    <text x="224" y="114" fill="#57C78B" font-size="34">done</text>

    <text x="64" y="158" fill="#A3A096" font-size="27">objective:</text>
    <text x="280" y="158" fill="#ECE8DC" font-size="27">write a.txt</text>
    <text x="64" y="194" fill="#A3A096" font-size="27">role:</text>
    <text x="280" y="194" fill="#ECE8DC" font-size="27">worker</text>
    <text x="64" y="230" fill="#A3A096" font-size="27">write scope:</text>
    <text x="280" y="230" fill="#ECE8DC" font-size="27">a.txt</text>
    <text x="64" y="266" fill="#A3A096" font-size="27">verification:</text>
    <text x="64" y="300" fill="#ECE8DC" font-size="27">command  test -f a.txt</text>

    <text x="64" y="342" fill="#A3A096" font-size="26">attempts</text>
    <text x="84" y="382" fill="#ECE8DC" font-size="28">#1</text>
    <text x="140" y="382" fill="#57C78B" font-size="28">done</text>
    <text x="84" y="422" fill="#A3A096" font-size="26">session=ses_x</text>
    <text x="84" y="458" fill="#A3A096" font-size="26">worktree=/tmp/wt/w1</text>
    <text x="84" y="494" fill="#A3A096" font-size="26">evidence:</text>
    <text x="258" y="494" fill="#ECE8DC" font-size="26">{&quot;exit&quot;:0}</text>

    <path d="M64 530H680" stroke="#4B5048" stroke-width="2"/>
    <text x="64" y="564" fill="#A3A096" font-size="26">esc back · ↑/↓ navigate</text>
    <text x="64" y="596" fill="#A3A096" font-size="26">a/r/c/t/s act</text>
  </g>
</svg>
