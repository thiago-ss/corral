<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Corral</title>
  <desc id="desc">Corral is a local control plane for parallel agent work, isolated branches, and evidence before merge.</desc>
  <style>
    .paper{fill:#F3F0E8}.raised{fill:#E7E2D7}.ink{fill:#191A16}.ink-stroke{stroke:#191A16}.muted{fill:#66665E}.rail{stroke:#B6AFA1}.amber{fill:#D8890B}.amber-stroke{stroke:#D8890B}.blue{fill:#2B63D9}.blue-stroke{stroke:#2B63D9}.green{fill:#1F7A50}.green-stroke{stroke:#1F7A50}
    @media (prefers-color-scheme:dark){.paper{fill:#141612}.raised{fill:#1D211C}.ink{fill:#ECE8DC}.ink-stroke{stroke:#ECE8DC}.muted{fill:#A3A096}.rail{stroke:#4B5048}.amber{fill:#F2AA2A}.amber-stroke{stroke:#F2AA2A}.blue{fill:#78A4FF}.blue-stroke{stroke:#78A4FF}.green{fill:#57C78B}.green-stroke{stroke:#57C78B}}
  </style>
  <rect width="1200" height="360" rx="24" class="paper"/>
  <path d="M0 32H1200M0 328H1200" class="rail" fill="none" stroke-width="2"/>
  <rect x="40" y="32" width="8" height="296" class="amber"/>

  <g transform="translate(84 78)">
    <rect width="104" height="104" rx="16" fill="#191A16"/>
    <path d="M25 24v56M45 24v56M65 24v56" fill="none" stroke="#D8890B" stroke-width="7" stroke-linecap="square"/>
    <path d="M78 24h8a6 6 0 0 1 6 6v12M92 62v12a6 6 0 0 1-6 6h-8" fill="none" stroke="#D8890B" stroke-width="5"/>
    <rect x="86" y="47" width="12" height="12" rx="2" fill="#78A4FF"/>
    <path d="M98 53h12" stroke="#78A4FF" stroke-width="5"/>
  </g>
  <text x="216" y="139" class="ink" font-family="'Avenir Next', Avenir, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">corral</text>
  <text x="88" y="230" class="ink" font-family="'Avenir Next', Avenir, system-ui, sans-serif" font-size="32" font-weight="700">Local control plane for agent work.</text>
  <text x="88" y="272" class="muted" font-family="'Avenir Next', Avenir, system-ui, sans-serif" font-size="25">Parallel agents. Isolated branches.</text>
  <text x="88" y="306" class="muted" font-family="'Avenir Next', Avenir, system-ui, sans-serif" font-size="25">Evidence before merge.</text>

  <g transform="translate(730 70)" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <text x="0" y="22" class="muted" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="22">worktrees</text>
    <path d="M10 78H150M10 145H150M10 212H150" class="rail" stroke-width="3"/>
    <rect x="30" y="58" width="150" height="40" rx="7" class="ink-stroke" stroke-width="3"/>
    <rect x="30" y="125" width="150" height="40" rx="7" class="blue-stroke" stroke-width="3"/>
    <rect x="30" y="192" width="150" height="40" rx="7" class="ink-stroke" stroke-width="3"/>
    <rect x="78" y="69" width="18" height="18" rx="3" class="ink" stroke="none"/>
    <rect x="112" y="136" width="18" height="18" rx="3" class="blue" stroke="none"/>
    <rect x="60" y="203" width="18" height="18" rx="3" class="ink" stroke="none"/>
    <path d="M180 78C234 78 232 145 280 145M180 145H280M180 212C234 212 232 145 280 145" class="rail" stroke-width="3"/>
    <path d="M280 90v35M280 165v35" class="amber-stroke" stroke-width="8"/>
    <rect x="267" y="132" width="26" height="26" rx="4" class="blue" stroke="none"/>
    <path d="M293 145H418" class="green-stroke" stroke-width="5"/>
    <path d="M405 132l13 13-13 13" class="green-stroke" stroke-width="5"/>
    <text x="246" y="248" class="ink" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="22">gate</text>
    <text x="260" y="183" class="ink" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="22">current branch</text>
  </g>
</svg>
