<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="corral banner">
  <!-- wordmark lockup: mark + name + tagline on paper -->
  <rect width="960" height="200" rx="28" fill="#FAFAF9"/>
  <rect x="0" y="0" width="14" height="200" fill="#F59E0B"/>
  <!-- mark -->
  <g transform="translate(36,30)">
    <rect x="0" y="0" width="140" height="140" rx="24" fill="#1C1917"/>
    <rect x="24" y="24" width="8" height="92" rx="4" fill="#F59E0B"/>
    <rect x="48" y="24" width="8" height="92" rx="4" fill="#F59E0B" opacity="0.55"/>
    <rect x="72" y="24" width="8" height="92" rx="4" fill="#F59E0B"/>
    <circle cx="36" cy="52" r="7" fill="#FAFAF9"/>
    <circle cx="36" cy="80" r="7" fill="#FAFAF9" opacity="0.75"/>
    <path d="M 104 24 h 14 a 6 6 0 0 1 6 6 v 80 a 6 6 0 0 1 -6 6 h -14" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="122" cy="70" r="6" fill="#2563EB"/>
    <path d="M 136 70 h 8" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- wordmark -->
  <text x="210" y="96" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#1C1917" letter-spacing="-1.5">corral</text>
  <text x="212" y="140" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#78716C">durable orchestration for agent runs</text>
  <!-- right side: three small state chips -->
  <g transform="translate(700,70)">
    <rect x="0" y="0" width="110" height="34" rx="17" fill="#16A34A"/>
    <text x="55" y="22" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAFAF9">verified</text>
    <rect x="0" y="44" width="110" height="34" rx="17" fill="#2563EB"/>
    <text x="55" y="66" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAFAF9">approved</text>
    <rect x="0" y="88" width="110" height="34" rx="17" fill="#1C1917"/>
    <text x="55" y="110" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FAFAF9">merged</text>
  </g>
</svg>
