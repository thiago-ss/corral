<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 480" width="1080" height="480" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <title id="title">Corral's default run pipeline</title>
  <desc id="desc">A goal becomes a graph, fans out to isolated worker branches, converges at an evidence gate, waits for operator approval, then lands in the current branch.</desc>
  <style>
    .paper{fill:#F3F0E8}.ink{fill:#191A16}.ink-stroke{stroke:#191A16}.muted{fill:#66665E}.rail{stroke:#B6AFA1}.amber{fill:#D8890B}.amber-stroke{stroke:#D8890B}.blue{fill:#2B63D9}.blue-stroke{stroke:#2B63D9}.green{fill:#1F7A50}.green-stroke{stroke:#1F7A50}
    @media (prefers-color-scheme:dark){.paper{fill:#141612}.ink{fill:#ECE8DC}.ink-stroke{stroke:#ECE8DC}.muted{fill:#A3A096}.rail{stroke:#4B5048}.amber{fill:#F2AA2A}.amber-stroke{stroke:#F2AA2A}.blue{fill:#78A4FF}.blue-stroke{stroke:#78A4FF}.green{fill:#57C78B}.green-stroke{stroke:#57C78B}}
  </style>
  <rect width="1080" height="480" rx="20" class="paper"/>
  <text x="48" y="58" class="muted" font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="24">planner's default graph</text>
  <path d="M48 82H1032" class="rail" stroke-width="2"/>

  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <circle cx="82" cy="240" r="34" class="ink-stroke" stroke-width="4"/>
    <rect x="70" y="228" width="24" height="24" rx="4" class="ink" stroke="none"/>
    <path d="M116 240H184" class="rail" stroke-width="4"/>
    <path d="M184 240C222 240 214 148 254 148M184 240H254M184 240C222 240 214 332 254 332" class="rail" stroke-width="4"/>

    <rect x="254" y="114" width="222" height="68" rx="8" class="ink-stroke" stroke-width="3"/>
    <rect x="254" y="206" width="222" height="68" rx="8" class="blue-stroke" stroke-width="4"/>
    <rect x="254" y="298" width="222" height="68" rx="8" class="ink-stroke" stroke-width="3"/>
    <path d="M278 148H448M278 240H448M278 332H448" class="rail" stroke-width="3"/>
    <rect x="292" y="136" width="24" height="24" rx="4" class="ink" stroke="none"/>
    <rect x="356" y="228" width="24" height="24" rx="4" class="blue" stroke="none"/>
    <rect x="324" y="320" width="24" height="24" rx="4" class="ink" stroke="none"/>

    <path d="M476 148C536 148 524 240 582 240M476 240H582M476 332C536 332 524 240 582 240" class="rail" stroke-width="4"/>
    <path d="M582 182v38M582 260v38" class="amber-stroke" stroke-width="10"/>
    <rect x="566" y="224" width="32" height="32" rx="5" class="blue" stroke="none"/>
    <path d="M598 240H696" class="rail" stroke-width="4"/>

    <path d="M740 194l46 46-46 46-46-46z" class="amber-stroke" stroke-width="5"/>
    <path d="M786 240H866" class="rail" stroke-width="4"/>
    <path d="M866 240H1012" class="green-stroke" stroke-width="6"/>
    <path d="M994 222l18 18-18 18" class="green-stroke" stroke-width="6"/>
  </g>

  <g font-family="'SFMono-Regular', 'Cascadia Code', monospace" font-size="22" text-anchor="middle">
    <text x="82" y="322" class="ink">goal</text>
    <text x="365" y="106" class="ink">isolated worktrees</text>
    <text x="582" y="340" class="ink">evidence</text>
    <text x="740" y="248" class="ink" font-size="24">you</text>
    <text x="740" y="340" class="ink">approval</text>
    <text x="934" y="322" class="ink">current branch</text>
  </g>
</svg>
