<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="corral pipeline">
  <rect width="960" height="300" rx="24" fill="#FAFAF9"/>
  <text x="32" y="42" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1C1917">one goal, one pipeline</text>

  <!-- planner -->
  <rect x="32" y="110" width="150" height="64" rx="12" fill="#1C1917"/>
  <text x="107" y="138" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F59E0B">planner</text>
  <text x="107" y="158" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#E7E5E4">turns the goal into a graph</text>
  <path d="M 182 142 H 224" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- workers (parallel) -->
  <rect x="224" y="76" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="294" y="102" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917">worker w1</text>
  <text x="294" y="120" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">own worktree</text>
  <rect x="224" y="148" width="140" height="56" rx="12" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="294" y="174" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917">worker w2</text>
  <text x="294" y="192" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">own worktree</text>
  <path d="M 364 104 H 406" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 364 176 H 406" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- checks -->
  <rect x="406" y="110" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
  <text x="471" y="138" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917">checks</text>
  <text x="471" y="158" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">evidence gates</text>
  <path d="M 536 142 H 578" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- gate -->
  <rect x="578" y="110" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3"/>
  <text x="643" y="138" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917">you approve</text>
  <text x="643" y="158" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">human gate</text>
  <path d="M 708 142 H 750" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- merge -->
  <rect x="750" y="110" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="815" y="138" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1C1917">merge</text>
  <text x="815" y="158" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">into main</text>

  <!-- lane labels -->
  <text x="294" y="62" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563EB">parallel, isolated</text>
  <text x="471" y="94" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#78716C">verification</text>
  <text x="643" y="94" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#B45309">approval</text>
  <text x="815" y="94" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803D">delivery</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A29E"/>
    </marker>
  </defs>
</svg>
