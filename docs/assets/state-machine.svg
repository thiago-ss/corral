<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img" aria-label="corral node lifecycle">
  <rect width="960" height="320" rx="24" fill="#FAFAF9"/>
  <text x="32" y="42" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1C1917">a node's life</text>

  <!-- main chain -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="40" y="120" width="92" height="52" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="86" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1917">pending</text>
    <text x="86" y="158" text-anchor="middle" font-size="10" fill="#78716C">waits for deps</text>

    <rect x="200" y="120" width="92" height="52" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="246" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1917">ready</text>
    <text x="246" y="158" text-anchor="middle" font-size="10" fill="#78716C">schedulable</text>

    <rect x="360" y="120" width="92" height="52" rx="10" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="406" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1917">leased</text>
    <text x="406" y="158" text-anchor="middle" font-size="10" fill="#78716C">claimed</text>

    <rect x="520" y="120" width="92" height="52" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="566" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#2563EB">running</text>
    <text x="566" y="158" text-anchor="middle" font-size="10" fill="#78716C">session active</text>

    <rect x="680" y="120" width="92" height="52" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="726" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#B45309">verifying</text>
    <text x="726" y="158" text-anchor="middle" font-size="10" fill="#78716C">evidence gate</text>

    <rect x="840" y="120" width="92" height="52" rx="10" fill="#16A34A"/>
    <text x="886" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#FAFAF9">done</text>
    <text x="886" y="158" text-anchor="middle" font-size="10" fill="#DCFCE7">verified</text>

    <path d="M 132 146 H 196" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M 292 146 H 356" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M 452 146 H 516" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M 612 146 H 676" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M 772 146 H 836" stroke="#A8A29E" stroke-width="3" fill="none" marker-end="url(#a)"/>
  </g>

  <!-- retry loop -->
  <path d="M 726 172 C 726 210 700 210 688 206" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#a)"/>
  <rect x="596" y="206" width="140" height="40" rx="10" fill="#FFF7ED" stroke="#F59E0B" stroke-width="2"/>
  <text x="666" y="232" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#B45309">retry_wait</text>
  <text x="666" y="270" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">feedback from the failed gate</text>
  <text x="666" y="286" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#78716C">goes into the next attempt</text>
  <path d="M 596 226 H 470" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#a)"/>
  <path d="M 470 226 V 150 H 294" fill="none" stroke="#F59E0B" stroke-width="3" marker-end="url(#a)"/>
  <text x="520" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#B45309">back to ready</text>

  <!-- terminal states -->
  <rect x="360" y="232" width="92" height="40" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="406" y="258" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#DC2626">failed</text>
  <path d="M 566 172 C 566 210 480 210 452 252" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#a)"/>

  <rect x="200" y="232" width="92" height="40" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="246" y="258" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#DC2626">blocked</text>
  <path d="M 566 172 C 566 210 300 210 246 232" fill="none" stroke="#DC2626" stroke-width="3" marker-end="url(#a)"/>
  <text x="330" y="216" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#DC2626">permission? rejection? dead dependency?</text>

  <rect x="40" y="232" width="92" height="40" rx="10" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="2"/>
  <text x="86" y="258" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#52525B">canceled</text>

  <!-- footnote -->
  <text x="32" y="308" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#78716C">a session going idle is never the end — only a passing evidence gate is. blocked and failed stop the pipeline until a human acts.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A8A29E"/>
    </marker>
  </defs>
</svg>
